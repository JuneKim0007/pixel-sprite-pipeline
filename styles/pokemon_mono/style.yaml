name: pokemon_mono
label: Pokemon-like, monochrome
extends: [base_pixel]
notes: >
  Bold readable creature design in a restricted two-tone palette. The palette
  is pinned rather than extracted, because a monochrome look is exactly the
  case where letting each run pick its own colours defeats the point.

vocabulary:
  style: [bold chunky outlines, flat cel shading, high contrast]
  palette_words: [monochrome, two-tone, cool greys]
  pose: [dynamic pose, mid-action, exaggerated silhouette]
  mood: [heroic, determined]

modules:
  character_sheet:
    style: "{medium}, {style}, {palette_words}, {render}, clean reference pose"
  animation:
    style: "{medium}, {style}, {palette_words}, {pose}, {render}"

settings:
  palette:
    source: file
    file: retro/pico8
    size: 8
  frames:
    lora_strength: 1.3
    cfg: 7.5

references:
  exemplars: []
  training_tier: hero
