# The reference's own pose, taken from an annotation rather than synthesised.
#
# Mark the joints on inputs/archer_dynamic.png in the Run tab first: the
# points you place become the control image, so the canonical reproduces
# that composition with this character in it, instead of an A-pose that
# disagrees with the drawing it is anchored to.
#
# annotate: require holds the job in the queue until the annotation exists,
# rather than running without it and looking like it worked.
name: archer_posed
module: character_sheet
subject: a young woman archer with short windswept pale cyan hair with pink streaks,
  red eyes, a white cropped jacket over a black and teal bodysuit, white shorts, black
  thigh-high socks, chunky black boots, a quiver of arrows, holding a curved black
  bow
style: pixel art, game sprite, plain flat background
rig: humanoid
pipeline:
  stages:
  - pose
  - depth
  - canonical
  - frames
  - palette
  - export
  stop_after: null
comfy:
  host: http://127.0.0.1:8188
pose:
  source: annotation
  size: 1024
canonical:
  seed: 41207
  candidates: 4
frames: {}
references:
  match:
    auto: true
    tolerance_degrees: 40
    exact_weight: 0.85
    far_weight: 0.45
  identity:
  - path: inputs/archer_dynamic.png
    view: front
    weight: 1.0
  style: []
  pose: []
  palette: []
styles:
- hi_fidelity
props:
- bow
- quiver
annotate: require
