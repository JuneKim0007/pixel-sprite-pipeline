# Character 1 - a red-veiled priestess, from a four-view reference sheet.
#
# Everything about the LOOK comes from styles/hi_fidelity. This file holds
# only who the character is, which views to make, and the two things that
# are specific to this body: the build and the seed.
#
# Weapons: the reference sheet has a flame staff. It is deliberately NOT
# configured here - a character sheet drops props by default, because a
# weapon occludes the torso it crosses and is a rigid volume the model
# traces instead of the limb behind it. Add it to the ANIMATION config.
name: char_1
module: character_sheet
rig: humanoid
styles:
- hi_fidelity
subject: a dark-skinned priestess with long dark brown hair, red eyes, a red hooded
  veil with gold tassel chains, a red and white bandeau top, bare midriff, a red and
  white layered wrap skirt with gold embroidery, gold jewellery, white arm wraps,
  strappy sandals
pipeline:
  stages:
  - pose
  - depth
  - canonical
  - frames
  - palette
  - export
  stop_after: null
pose:
  source: tpose
  size: 1024
  set:
  - view: front
  - view: side
  - view: rear
  - view: 270
references:
  match:
    auto: true
    tolerance_degrees: 40
    exact_weight: 0.85
    far_weight: 0.45
  identity:
  - path: overnight/char_1/refs/front.png
    view: front
  - path: overnight/char_1/refs/side.png
    view: side
  - path: overnight/char_1/refs/rear.png
    view: rear
  - path: overnight/char_1/refs/side_right.png
    view: 270
  style: []
  pose: []
  palette: []
depth:
  build:
    torso: 1.24
    arms: 1.24
    legs: 1.24
    neck: 1.24
    head: 1.02
canonical:
  seed: 71104
  candidates: 2
frames: {}
cooling:
  enabled: true
  seconds: 420
