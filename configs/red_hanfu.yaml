# Character sheet from one supplied illustration.
# Identity: the illustration, at 'linear' so it stops copying the
# reference's grey-gradient background along with the character.
# Anchor: the generated canonical at 0.9 - it carries the pixel style
# and must outweigh a smooth illustration, not sit under it.
name: red_hanfu
module: character_sheet
subject: a woman with very long flowing crimson red hair, wearing a black and deep
  red hanfu robe with wide draping sleeves, a gold and jade waist ornament hanging
  from a red sash, black skirt, geta sandals
style: pixel art, game sprite, plain flat background
rig: humanoid
pipeline:
  stages:
  - pose
  - depth
  - canonical
  - frames
  - palette
  - export
  stop_after: null
comfy:
  host: http://127.0.0.1:8188
pose:
  source: tpose
  size: 1024
  set:
  - view: front
  - view: side
  - view: rear
  - view: 270
depth:
  near: 255
  far: 60
  blur: 6.0
canonical:
  seed: 77031
  lcm: false
  steps: 45
  cfg: 7.0
  lora_strength: 1.2
  width: 1024
  height: 1024
  style_weight: 0.18
frames:
  lcm: false
  steps: 25
  cfg: 7.0
  lora_strength: 1.2
  denoise: 1.0
  width: 1024
  height: 1024
  controlnet:
    strength: 0.75
    start_percent: 0.0
    end_percent: 0.55
  depth_controlnet:
    strength: 0.45
    start_percent: 0.0
    end_percent: 0.6
  ip_adapter:
    weight: 0.7
    weight_type: linear
    start_at: 0.0
    end_at: 1.0
    anchor: true
    anchor_weight: 0.9
  style_weight: 0.18
references:
  match:
    auto: true
    tolerance_degrees: 40
    exact_weight: 0.85
    far_weight: 0.45
  identity:
  - path: inputs/red_hanfu_swordswoman.png
    view: front
    weight: 1.0
  style: []
  pose: []
  palette: []
palette:
  source: extract
  size: 16
  factor: 8
  reduce: median
  alpha_tolerance: 14
  upscale: 1
export:
  columns: 4
  scale: 4
styles:
- hi_fidelity
background:
  enabled: true
  colour: '#FF00FF'
