# Character sheet from one dynamically-posed illustration.
#
# The reference's pose is irrelevant here and needs no rigging: a sheet
# synthesises its own A-pose from the rig, and the reference supplies
# identity, not composition. Rigging a reference only matters when you
# want to REPRODUCE its pose - that is the `pose` role, not `identity`.
#
# Everything about the look now comes from styles/hi_fidelity. This file
# holds only who the character is.
name: archer
module: character_sheet
subject: a young woman archer with short windswept pale cyan hair with pink streaks,
  red eyes, a white cropped jacket over a black and teal bodysuit, white shorts, black
  thigh-high socks, chunky black boots, a quiver of arrows, holding a curved black
  bow
style: pixel art, game sprite, plain flat background
rig: humanoid
pipeline:
  stages:
  - pose
  - depth
  - canonical
  - frames
  - palette
  - export
  stop_after: null
comfy:
  host: http://127.0.0.1:8188
pose:
  source: tpose
  size: 1024
  set:
  - view: front
  - view: side
  - view: rear
  - view: 270
canonical:
  seed: 41207
  candidates: 2
frames: {}
references:
  match:
    auto: true
    tolerance_degrees: 40
    exact_weight: 0.85
    far_weight: 0.45
  identity:
  - path: inputs/archer_dynamic.png
    view: front
    weight: 1.0
  style: []
  pose: []
  palette: []
styles:
- hi_fidelity
props:
- bow
- quiver
