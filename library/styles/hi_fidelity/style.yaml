name: hi_fidelity
label: High fidelity pixel art
extends: [retro_jrpg]
notes: >
  For sprites that should stand up to being looked at closely: more colours
  and more steps, at the canvas that keeps the reduction gentlest.

  It used to generate at 1280/factor 10. Same 128px sprite, but a 5:1
  reduction against 1024/8's 4:1 - a larger canvas is only a finer source
  if the factor does not grow with it, and here it did.

  Costs roughly three times the GPU time of retro_jrpg. Worth it for a hero
  or a boss, wasteful for a field mob.

vocabulary:
  style:
    - detailed pixel art sprite
    - crisp clean pixel clusters
    - firm dark outline
    - readable silhouette
  shading:
    - deliberate cel shading
    - three-tone shading with a rim light
    - no gradients

settings:
  # This sheet costs roughly three times retro_jrpg per image - larger canvas,
  # more steps - so each task leaves the machine hotter and the rest is longer.
  cooling:
    seconds: 240

  canonical:
    # Exemplars carry rendering, not colour. At the 0.35 role default the
    # silver-haired exemplars in this sheet pulled a crimson-haired
    # character toward lavender; 0.18 keeps the brushwork and lets the
    # prompt keep the palette.
    style_weight: 0.18
    steps: 60
    # 1024/8 = 128. Was 1280/10, also 128, but measured worse on the ratio
    # DECISIONS.md says governs mush: reduction is (canvas / native block) /
    # sprite, so 1280 averaged 25 logical pixels into each output pixel where
    # 1024 averages 16. It also would not fit - one 1280 canonical with
    # ControlNet and IP-Adapter loaded peaks over the 10.67 GiB MPS ceiling
    # on a 16 GB machine.
    width: 1024
    height: 1024
    cfg: 8.0
  frames:
    # Exemplars carry rendering, not colour. At the 0.35 role default the
    # silver-haired exemplars in this sheet pulled a crimson-haired
    # character toward lavender; 0.18 keeps the brushwork and lets the
    # prompt keep the palette.
    style_weight: 0.18
    steps: 45
    width: 1024
    height: 1024
    cfg: 8.0
  palette:
    size: 40
    factor: 8           # 1024/8 = 128. Moves WITH the canvas above - changing
                        # one without the other silently resizes the sprite.
