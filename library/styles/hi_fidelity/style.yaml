name: hi_fidelity
label: High fidelity pixel art
extends: [retro_jrpg]
notes: >
  For sprites that should stand up to being looked at closely: more colours
  and more steps, at the canvas that keeps the reduction gentlest.

  It used to generate at 1280/factor 10. Same 128px sprite, but a 5:1
  reduction against 1024/8's 4:1 - a larger canvas is only a finer source
  if the factor does not grow with it, and here it did.

  Costs roughly three times the GPU time of retro_jrpg. Worth it for a hero
  or a boss, wasteful for a field mob.

vocabulary:
  # Only the delta from retro_jrpg: groups merge down the chain, they do not replace.
  style:
    - detailed pixel art
  shading:
    - rim light

settings:
  # This sheet costs roughly three times retro_jrpg per image, so each task leaves the machine hotter.
  cooling:
    seconds: 240

  canonical:
    # Exemplars carry rendering, not colour: at 0.35 the silver-haired ones pulled a crimson character to lavender.
    style_weight: 0.18
    steps: 60
    # 1024/8 = 128. 1280/10 is also 128 and measured worse, and one 1280 canonical will not fit in 10.67 GiB.
    width: 1024
    height: 1024
    cfg: 8.0
  frames:
    # Exemplars carry rendering, not colour: at 0.35 the silver-haired ones pulled a crimson character to lavender.
    style_weight: 0.18
    steps: 45
    width: 1024
    height: 1024
    cfg: 8.0
  palette:
    size: 16
    factor: 8           # Moves WITH the canvas above; one without the other resizes the sprite.
