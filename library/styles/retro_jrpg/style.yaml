name: retro_jrpg
label: Retro JRPG (RPG Maker / Pokemon era)
extends: [base_pixel]
notes: >
  Chunky readable sprites in the SNES / early Pokemon idiom: large flat colour
  areas inside a bold black outline, rather than fine per-pixel rendering.

  A style sheet is not only prompt words — most of what separates a flat,
  muddy sprite from a crisp one lives in the numbers below, so they are part
  of the style.

vocabulary:
  style:
    - snes sprite
    - chunky pixels
    - bold black outline
  shading:
    - flat cel shading
    - two tone shading
  framing:
    - full body
  palette_words:
    - vibrant colors
    - high contrast
  avoid:
    - noisy
    - speckled
    - monochrome
    - desaturated
    - washed out

modules:
  character_sheet:
    style: "{medium}, {render}, {style}, {shading}, {palette_words}, {framing}"
  animation:
    style: "{medium}, {render}, {style}, {shading}, {palette_words}, {framing}"

settings:
  palette:
    source: extract
    # Measured: at 12 colours a silver-armoured sprite read as monochrome. Colour count IS detail when shapes are flat.
    size: 14
    factor: 8            # verified as the LoRA's true grid by variance sweep
    reduce: median       # 100% structural accuracy against ground truth
    alpha_tolerance: 16

  canonical:
    # The anchor is generated once and every frame inherits from it, so steps are cheapest here.
    steps: 40
    cfg: 7.5
    lora_strength: 1.2   # the LoRA author's figure; higher speckles the blocks
    sampler: dpmpp_3m_sde
    scheduler: karras

  frames:
    # Below ~20 steps the source is noisy, and median reduction turns that noise into scattered pixels.
    steps: 30
    cfg: 7.5
    lora_strength: 1.2
    sampler: dpmpp_3m_sde
    scheduler: karras
