name: base_pixel
label: Base pixel art
notes: >
  The shared floor every other sheet builds on. Holds only what is true of all
  pixel art here, so a sheet that extends it can disagree about mood without
  restating the basics.

vocabulary:
  medium: [pixel art, game sprite]
  render: [flat colors, hard edges, limited palette]
  # Merged down the extends chain, so a sheet adds only what it alone must avoid.
  avoid:
    - antialiased
    - smooth gradient
    - dithered
    - blurry
    - soft
    - jpeg artifacts
    - photo
    - realistic
    - 3d render
    - watermark
    - signature
    - text
    - extra limbs
    - deformed
    - low contrast
    - muddy colors

modules:
  character_sheet:
    style: "{medium}, {render}, clean reference pose, full body, centered"
  animation:
    style: "{medium}, {render}, full body"

settings:
  # The figure fills the frame: the rigs are authored small, so a third of the canvas was background.
  pose:
    # The model overfills its guide by about 2x the ask, so 0.70 predicts ~0.87.
    fill: 0.70

    # Lifts the hands off the hip; 0 leaves no gap in the silhouette, 90 reads as a weapon stance.
    arm_angle: 55.0

    # Per group, not lateral_scale: that widens the skull with the shoulders. 6.26 h/shoulder to 5.44.
    spread:
      arms: 1.15
      torso: 1.15

  # Seven heads rather than the rig's 5.2. Set here, not in rigs.py: a new neutral would re-scale every stored pose.
  proportions:
    legs: 1.60
    torso: 1.20
    # Measured 2026-09-11: legs 1.6 and torso 1.2 leave the arms behind, hands above the hip.
    arms: 1.5

  palette:
    reduce: median
    factor: 8
    # A sprite reads by its value structure, so a wrong-lightness entry collapses the form.
    match: luma

  # Magenta, not chroma green: green sits close to skin and cloth, and each bled pixel costs a palette entry.
  background:
    enabled: true
    # Three runs measured 0.0% of the requested colour, so the painted corners are the only reliable key.
    colour: auto

  # `linear` rather than `style and composition`: the latter copies the reference's background too.

  # Canvas / factor is the sprite size, so the canvas belongs beside the palette.
  canonical:
    width: 1024
    height: 1024
    negative: "{avoid}"
    # Measured over 8 characters: identity 1.15 / style 0.12 beat 0.85/0.28 on likeness and bleed, but copied the reference as an illustration.
    from_reference: {weight_type: linear, weight: 0.9}
    style_weight: 0.12
    # Measured on char8: 0.8 -> block 3.0 likeness 0.7538, 1.6 -> block 1.0 likeness 0.6529. Higher buys dithering, not bigger pixels.
    lora_strength: 0.8
  frames:
    width: 1024
    height: 1024
    negative: "{avoid}"
    ip_adapter:
      weight_type: linear
      anchor: true
      anchor_weight: 0.9
      # The anchor is front-facing and identical on every frame, so `style and composition` makes every view inherit a front pose.
      anchor_weight_type: linear
      anchor_end_at: 1.0
    # Keep equal to canonical's: the frames are matched against the anchor, and a different weight is a different style to match.
    lora_strength: 0.8
    style_weight: 0.12
