name: crisp
label: Crisp high-fidelity pixel art
extends: [base_pixel]
notes: >
  hi_fidelity extends retro_jrpg, and vocabulary groups MERGE down the chain
  rather than replace. So its resolved style group reads "snes sprite, chunky
  pixels, bold black outline, detailed pixel art" — three SNES-era terms
  against the one fidelity term it adds, and the retro half wins. A child
  cannot take a word back, so the only way out of the idiom is to leave the
  chain.

  This sheet extends base_pixel alone. Measured against the reference art in
  training_set: many shading tones rather than two, clusters fine enough to
  render an eye, outlines thin and coloured rather than a bold black key line,
  and a palette rich enough that skin carries more than one step.

vocabulary:
  style:
    - detailed pixel art
    - fine pixel clusters
    - clean readable shapes
  shading:
    - soft cel shading
    - three tone shading
    - rim light
  outline:
    - thin dark outline
  framing:
    - full body
  palette_words:
    - rich color
    - high contrast

settings:
  cooling:
    seconds: 240

  canonical:
    # hi_fidelity reasons its way to 0.18 from the role default of 0.35:
    # exemplars carry rendering, not colour, and silver-haired ones pull a
    # dark-haired character toward lavender. Measured over eight characters,
    # 0.12 against identity 1.15 goes further - likeness 0.7068 against 0.6829
    # and bleed 0.0326 against 0.0593.
    style_weight: 0.12
    steps: 60
    width: 1024
    height: 1024
    cfg: 8.0
  frames:
    style_weight: 0.12
    steps: 60
    width: 1024
    height: 1024
    cfg: 8.0
