# What kind of thing a pipeline makes; the rail shows one cell per file here.
label: Character sheet
detail: one pose, several angles
blurb: One reference pose seen from several angles. Usually the first thing you make,
  and the input to an animation.
stages:
- pose
- depth
- canonical
- frames
- palette
- export
props: false
# A sheet starts from the rig, not an animation's first frame; a config's own pose.source still wins.
defaults:
  pose.source: tpose
