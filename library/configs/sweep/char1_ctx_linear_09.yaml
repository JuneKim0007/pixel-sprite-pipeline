module: character_sheet
subject: a young woman with long straight black hair, a white shirt with a red necktie,
  a black jacket, a black pleated skirt, black knee socks and black loafers
styles:
- crisp
props: []
props_enabled: false
pose:
  source: tpose
  size: 1024
  set:
  - view: front
canonical:
  candidates: 1
  from_reference:
    weight: 0.9
    weight_type: linear
references:
  identity:
  - path: characters/char1/front.png
    view: front
  - path: characters/char1/side.png
    view: side
  - path: characters/char1/side_right.png
    view: 270
  - path: characters/char1/rear.png
    view: rear
pipeline:
  stages:
  - pose
  - depth
  - canonical
  stop_after: canonical
cooling:
  enabled: true
  seconds: 60
depth:
  build:
    chest: 1.15
    thigh: 1.0
    torso: 0.95
