module: character_sheet
subject: a dark skinned man with a white head veil, bare chest, navy and gold patterned
  wrap trousers, gold jewellery and brown boots
style: pixel art, game sprite
styles:
- crisp
props: []
props_enabled: false
pose:
  source: tpose
  size: 1024
  set:
  - view: front
canonical:
  candidates: 1
references:
  identity:
  - path: library/refs/char6/front.png
    view: front
  - path: library/refs/char6/side.png
    view: side
  - path: library/refs/char6/side_right.png
    view: 270
  - path: library/refs/char6/rear.png
    view: rear
pipeline:
  stages:
  - pose
  - depth
  - canonical
  - pixelise
  stop_after: pixelise
cooling:
  enabled: true
  seconds: 60
