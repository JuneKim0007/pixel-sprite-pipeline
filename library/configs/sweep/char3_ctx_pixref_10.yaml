module: character_sheet
subject: a dark skinned woman with long black hair, a deep red veil and headscarf,
  a red and gold layered dress and gold sandals
styles:
- crisp
props: []
props_enabled: false
pose:
  source: tpose
  size: 1024
  set:
  - view: front
canonical:
  candidates: 1
  lora_strength: 1.0
  from_reference:
    weight: 0.9
    weight_type: linear
references:
  identity:
  - path: characters/char3/front_px.png
    view: front
  - path: characters/char3/side_px.png
    view: side
  - path: characters/char3/side_right_px.png
    view: 270
  - path: characters/char3/rear_px.png
    view: rear
pipeline:
  stages:
  - pose
  - depth
  - canonical
  stop_after: canonical
cooling:
  enabled: true
  seconds: 60
depth:
  build:
    chest: 1.25
    thigh: 1.15
    torso: 1.05
