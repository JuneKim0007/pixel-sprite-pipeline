module: character_sheet
subject: a woman with long silver white hair, a black tactical vest, an olive cape,
  black thigh socks and black boots
styles:
- crisp
props: []
props_enabled: false
pose:
  source: tpose
  size: 1024
  set:
  - view: front
canonical:
  candidates: 1
  lora_strength: 1.3
  from_reference:
    weight: 1.25
    weight_type: linear
references:
  identity:
  - path: characters/char7/front_px.png
    view: front
  - path: characters/char7/side_px.png
    view: side
  - path: characters/char7/side_right_px.png
    view: 270
  - path: characters/char7/rear_px.png
    view: rear
pipeline:
  stages:
  - pose
  - depth
  - canonical
  stop_after: canonical
cooling:
  enabled: true
  seconds: 60
models:
  ipadapter: ip-adapter-plus_sdxl_vit-h.safetensors
depth:
  build:
    chest: 1.1
    thigh: 1.0
    torso: 1.0
