module: character_sheet
subject: a woman with long black hair, dark red and navy armour, a red cape and navy
  thigh boots
styles:
- crisp
props: []
props_enabled: false
pose:
  source: tpose
  size: 1024
  set:
  - view: front
canonical:
  candidates: 1
references:
  identity:
  - path: library/refs/char8/front.png
    view: front
  - path: library/refs/char8/side.png
    view: side
  - path: library/refs/char8/side_right.png
    view: 270
  - path: library/refs/char8/rear.png
    view: rear
pipeline:
  stages:
  - pose
  - depth
  - canonical
  - pixelise
  stop_after: pixelise
cooling:
  enabled: true
  seconds: 60
pixelise:
  denoise: 0.3
