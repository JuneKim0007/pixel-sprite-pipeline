# EXPERIMENT, not a shipped pipeline: lateral_scale 1.35 widens the skeleton, depth.build on top.

module: character_sheet
subject: a young woman with long black hair, red eyes, a white shirt with a red
  necktie, a black jacket worn off the shoulders, a black pleated skirt, black
  knee socks, black loafers
style: pixel art, game sprite
styles:
- hi_fidelity

props:
- longsword

# Pass 2, between pass 1's 1.0/1.0 and the style sheet's 1.6/1.2. Width comes from depth.build.
proportions:
  legs: 1.15
  torso: 1.1

background:
  colour: 242, 94, 147

depth:
  # The reference sheet is h/shoulder 4.42 and the rig 6.17; no proportion group scales width.
  build:
    torso: 1.55
    arms: 1.40
    legs: 1.30
    neck: 1.20
    head: 1.05

canonical:
  # Pass 1's 0.18 with end_at 0.45 lost the outline, so both are raised together.
  style_weight: 0.28
  style:
    end_at: 0.65
  candidates: 1

pose:
  source: tpose
  size: 1024
  # Measured pass 2: the model overflows the guide by 1.23x, so 0.69 lands it at 0.85.
  fill: 0.69
  # The projection's own width dial, never tried before today.
  lateral_scale: 1.35
  margin: 0.14
  set:
  - view: front
  - view: side
  - view: rear

references:
  identity:
  - path: library/refs/experiment_slim/front.png
    view: front
    weight: 1.0
  - path: library/refs/experiment_slim/side.png
    view: side
    weight: 1.0
  - path: library/refs/experiment_slim/rear.png
    view: rear
    weight: 1.0

pipeline:
  stages:
  - pose
  - depth
  - canonical
  - frames
  - palette
  - export

# Unattended: a ten minute rest between GPU tasks.
cooling:
  enabled: true
  seconds: 600
