# Six-frame knight attack animation, the documented reference config. See docs/CONFIGURING.md.

name: knight_attack

# Scopes the settings UI, so a T-pose sheet shows no knobs about LLM-authored motion.
module: animation

# Both stages that write prompts read these, so the description lives in one place.
subject: a knight in steel armor
props:
- longsword
style: pixel art, game sprite, side view

pipeline:
  # Validated before anything runs. Independent CPU stages overlap; GPU stages never do.
  stages: [pose, depth, canonical, frames, softbody, palette, export]

comfy:
  host: http://127.0.0.1:8188

# COMPUTE. No "GPU cores" setting exists: Metal cannot partition the GPU between processes.
compute:
  torch_threads: 8      # CPU threads for tensor work; more is not always faster.
  mps_high_watermark: 0.9   # fraction of unified memory PyTorch may claim; 0.0 disables the cap.

# 1. POSE — authored input, never estimated: pose estimators are trained on photographs.
pose:
  source: library       # 'library' reads poses/*.json; 'llm' generates from `action` below.
  name: attack          # poses/attack.json — see tools/make_poses.py
  frames: 6             # blank = all frames in the file; a number truncates

  # front(0) three_quarter_front(40) side(90) three_quarter_rear(145) rear(180), or any number.
  view: three_quarter_front

  size: 1024            # must match the generation resolution below
  thickness:            # blank = auto-scale OpenPose's 4px-at-368 convention
  depth_scale: 1.0      # exaggerate forward/back motion without re-authoring
  lateral_scale: 1.0    # widen or narrow the character's stance

  # `set:` instead of `name:` makes a pose SET rather than an animation — see docs/PIPELINE.md.

  # Only read when source: llm.
  action: a character swinging a sword downward, ending in follow-through
  llm:
    model: qwen3:4b
    temperature: 0.7    # LLM creativity. Nothing to do with image variance.
    attempts: 3         # retries; failures are fed back as explicit criticism
    tolerance: 0.3      # allowed bone-length drift after anatomy snapping
    cache: true         # write accepted poses to poses/generated/ for reuse
    keep_alive: 0       # unload immediately — 16GB can't hold this and SDXL

# 1b. DEPTH (optional) — separates three-quarter-rear from rear, which project to the same keypoints.
depth:
  view:                 # blank = follow pose.view
  size:                 # blank = follow pose.size
  near: 255             # brightness of the closest surface
  far: 60               # brightness of the farthest; a narrow gap gives flatter depth.
  blur: 6.0             # hard polygon edges read as geometry and condition less well.

# 2. CANONICAL — every frame inherits its identity and colours, so weakness here propagates.
canonical:
  seed: 1234            # PIN THIS. Frames reuse it; changing it changes the character.
  lcm: false            # LCM is ~3x faster and drops prompt details (it lost "holding a sword").
  steps: 25
  cfg: 7.0              # prompt adherence. 7 is the SDXL default sweet spot.
  lora_strength: 1.2    # pixel-art-xl; 1.2 is the author's recommendation
  width: 1024
  height: 1024
  # prompt:             # uncomment to override the subject+style composition

# 3. FRAMES — one sprite per skeleton. ONLY the skeleton varies between them.
frames:
  # MEASURED: under LCM the pose is only partly obeyed, because LCM settles composition in its first steps.
  lcm: false
  steps: 20
  cfg: 7.0              # with lcm: true this must drop to ~1.5
  lora_strength: 1.2
  denoise: 1.0          # below 1.0 carries over the previous latent, for img2img chains only.
  width: 1024
  height: 1024
  # seed:               # defaults to canonical.seed. Keep them equal.

  controlnet:           # pins the POSE
    union_type: openpose  # ESSENTIAL. The Union model otherwise guesses, and the pose is silently ignored.
    strength: 0.75      # how hard the skeleton is enforced
    start_percent: 0.0
    end_percent: 0.55   # the usual ~0.2 advice assumes 25-30 steps; 0.2 of 20 is only 4 and the pose does not take.

  depth_controlnet:     # only used when the depth stage ran; stacks with the pose control, same model.
    strength: 0.45      # keep BELOW the pose strength, or volume makes sprites look rendered.
    start_percent: 0.0
    end_percent: 0.6

  ip_adapter:           # pins the IDENTITY, from the canonical sprite
    weight: 0.7         # measured: 0.85 fights the pose control. Ignored when references.match.auto is true.
    weight_type: style and composition
    start_at: 0.0
    end_at: 1.0

# REFERENCES (optional). With no close reference the weight goes DOWN, not up, or it fights the pose.
references:
  match:
    auto: true          # derive weight per frame from angular distance
    tolerance_degrees: 40   # within this, treat as an exact match
    exact_weight: 0.85  # weight when a reference matches the view
    far_weight: 0.45    # weight at a full 180-degree mismatch

  identity: []
  style: []
  pose: []
  palette: []

# 3b. SOFTBODY (optional) — a warp moves pixels that exist; past ~4px at 128 output the stretching shows.
softbody:
  fps: 12               # playback rate the simulation assumes
  loop: true            # cyclic motion — pre-rolls so frame 0 is not at rest
  preroll_cycles: 2     # settling passes before recording
  nodes: []             # empty = no secondary motion; fields and defaults are SoftNode in geometry/softbody.py.

# 4. PALETTE — extracted once from the canonical and imposed on every frame, so colour cannot drift.
palette:
  source: extract       # from the canonical's SUBJECT, keyed first: a sprite is ~15% of the canvas.
  size: 12              # target palette size
  factor: 8             # 1024 / 8 = 128px sprites, verified by intra-block variance sweep.
  reduce: median        # median measured 100% structural accuracy on ground truth; mode only 70%.
  alpha_tolerance: 14   # edge-connected background keyed to transparent
  upscale: 1            # nearest-neighbour scale-up of each frame
  workers:              # blank = one per CPU core. Frames are independent.

# 5. EXPORT — sprite sheet plus the cell geometry an engine needs.
export:
  columns:              # blank = single row
  scale: 4              # nearest-neighbour upscale of the finished sheet
