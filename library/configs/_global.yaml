# Machine-level defaults; every pipeline inherits these unless it overrides them.
paths:
  input_dir: library/refs
  output_dir: out/runs
  download_dir: out/exports
comfy:
  host: http://127.0.0.1:8188
compute:
  # --lowvram: weights alone are ~9.8 GiB against a 10.67 GiB ceiling. NOT --gpu-only, measured ~5x slower.
  vram_mode: --lowvram
  # 6 of this M2's 8 cores; the 2 spare keep the machine usable through a long run.
  torch_threads: 6
  # 0.0 = no ceiling; the stack does not fit under one. ctl.sh pins the low watermark to this too.
  mps_high_watermark: 0.0
  cpu_workers:
  batch: 1
models:
  checkpoint: sd_xl_base_1.0.safetensors
  pixel_lora: pixel-art-xl.safetensors
  controlnet: controlnet-union-sdxl-promax.safetensors
  ipadapter: ip-adapter_sdxl_vit-h.safetensors
ui:
  suppress_gate_confirm: true

# Four hours, per image not per stage: a 1024 image takes about 280 s on this machine.
canonical:
  timeout: 14400
  # Sequential: a batch at the 1280 canvas needs ~10.2 GiB against a 9.6 GiB ceiling, and only sequential can rest.
  batch_candidates: false
frames:
  timeout: 14400

# Rest between GPU tasks: twenty hours near the throttle point ages the machine. ~2.5 h a night.
cooling:
  enabled: true
