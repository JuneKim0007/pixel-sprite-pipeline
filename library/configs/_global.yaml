# Machine-level defaults. Every pipeline inherits these unless it
# overrides them. Edit here to change all pipelines at once.
paths:
  input_dir: library/refs
  output_dir: out/runs
  download_dir: out/exports
comfy:
  host: http://127.0.0.1:8188
compute:
  # Offload submodules instead of holding every model resident.
  #
  # Measured here: SDXL 4897 MB + CLIP 1561 MB + CLIPVision 1208 MB +
  # ControlNet 2397 MB all came back "full load: True" - ~9.8 GiB of weights
  # against a 10.67 GiB ceiling, leaving nothing for activations. It OOM'd
  # identically at 1024 and 1280, which is the tell that the canvas was never
  # the problem.
  #
  # NOT --gpu-only, which is the opposite flag and measured ~5x slower here
  # because it FORBIDS offloading and macOS swaps instead. --lowvram keeps
  # only the active submodule on device, trading some speed for fitting.
  vram_mode: --lowvram
  # 6 of this M2's 8 cores = 75%, the closest step inside an 80+-5% target
  # (7 would be 87.5%). Leaves the 2 spare for the OS so the machine stays
  # usable during a long run. CPU only - there is no GPU equivalent, see the
  # cooling note below.
  torch_threads: 6
  # 0.0 = no hard ceiling on torch's MPS allocator. NOT recklessness: this
  # stack does not fit under one, and the ceiling turns "evict and retry" into
  # a fatal RuntimeError.
  #
  # Measured on a 16 GB M2 (recommended working set 10.67 GiB). Weights alone:
  # SDXL 4897 + CLIP 1561 + CLIPVision 1208 + ControlNet 2397 = ~9.8 GiB,
  # leaving ~0.8 GiB for activations. It died at 10.66 GiB with the canvas at
  # BOTH 1280 and 1024 - identical figure, which is how we know the canvas was
  # never the cause - and again with --lowvram on.
  #
  # With --lowvram (see vram_mode) ComfyUI keeps residency down on its own;
  # this just stops torch refusing the last 5 MiB. Above the recommended set
  # macOS pages, which is slower but not harmful - the SoC throttles rather
  # than damages, and thermal duty cycling is handled by `cooling` below.
  #
  # ctl.sh pins the LOW watermark to this value too; torch rejects low > high.
  mps_high_watermark: 0.0
  cpu_workers:
  batch: 1
models:
  checkpoint: sd_xl_base_1.0.safetensors
  pixel_lora: pixel-art-xl.safetensors
  controlnet: controlnet-union-sdxl-promax.safetensors
  ipadapter: ip-adapter_sdxl_vit-h.safetensors
ui:
  suppress_gate_confirm: true
  suppress_overwrite_confirm: false

# How long a single GPU stage may wait on ComfyUI before giving up.
# Four hours: a 1024 image takes about 280 s on this machine, so this covers a
# slow candidate sequence or a cold model load without a hung job holding the
# queue overnight. Per image, not per stage - candidates are sequential.
canonical:
  timeout: 14400
  # Sequential candidates, not one batch. Two reasons, both machine-level.
  #
  # Memory: batching candidates at hi_fidelity's 1280 canvas needs ~10.2 GiB
  # against a 9.6 GiB MPS ceiling on 16 GB, and dies with "MPS backend out of
  # memory" partway into the anchor. 1280 is 1.6x the pixels of 1024, so a
  # batch of 2 here costs what a batch of 3 does at the benchmarked size.
  #
  # Thermal: sequential is the ONLY path that can rest between candidates, so
  # an overnight run with cooling on wants it regardless. See CONFIGURING.md -
  # it is ~14% slower per DECISIONS.md, which an unattended queue does not care
  # about.
  batch_candidates: false
frames:
  timeout: 14400

# Rest between GPU tasks - between stages, between candidates, between frames.
#
# Not because anything needs the pause to work. A laptop generating for twenty
# hours holds its SoC near the throttle point for the whole night, and sustained
# heat is what shortens a battery rather than any single hot moment. The machine
# will not fail; it will throttle, finish anyway, and quietly age.
#
# The cost is real and worth stating: at three minutes a rest, a fifty-image
# night spends two and a half hours resting. That is the trade.
#
# Rests happen AFTER a task and never before, and never after the last one.
cooling:
  enabled: true
  seconds: 180
