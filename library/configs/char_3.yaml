# Character 3 - from a four-view reference sheet.
#
# The look comes from styles/hi_fidelity. This file holds only who the
# character is, which views to make, and the two things specific to this
# body: the build and the seed.
#
# Weapon: the reference sheet shows an icy bow and a quiver of crystal arrows. Deliberately absent -
# a sheet drops props by default, because a weapon occludes the torso it
# crosses and is a rigid volume the model traces instead of the limb
# behind it. It will be drawn by hand, or added to an animation config.
name: char_3
module: character_sheet
rig: humanoid
styles:
- hi_fidelity
subject: a mint-green haired elf archer with pointed ears, blue eyes and a gold circlet, wearing a 
  dark teal shoulder mantle with gold trim, a pale ice-blue layered robe dress with a high slit, 
  sheer translucent ice-blue wide sleeves and side panels with crystal pendants, a brown leather 
  belt, pale blue armoured greaves with snowflake motifs
pipeline:
  stages:
  - pose
  - depth
  - canonical
  - frames
  - palette
  - export
  stop_after:
pose:
  source: tpose
  size: 1024
  set:
  - view: front
  - view: side
  - view: rear
  - view: 270
references:
  match:
    auto: true
    tolerance_degrees: 40
    exact_weight: 0.85
    far_weight: 0.45
  identity:
  - path: overnight/char_3/refs/front.png
    view: front
  - path: overnight/char_3/refs/side.png
    view: side
  - path: overnight/char_3/refs/rear.png
    view: rear
  - path: overnight/char_3/refs/side_right.png
    view: 270
  style: []
  pose: []
  palette:
  - path: palettes/char_3.hex
depth:
  build:
    torso: 1.55
    arms: 1.45
    legs: 1.24
    neck: 1.24
    head: 1.02
canonical:
  seed: 33940
  candidates: 2
  style_weight: 0.25
frames:
  style_weight: 0.25
  depth_controlnet:
    strength: 0.55
    start_percent: 0.0
    end_percent: 0.65
  ip_adapter:
    anchor_falloff: 0.7
    anchor_far_weight: 0.5
cooling:
  enabled: true
  seconds: 600
palette:
  source: file
  file: char_3
  match: luma
