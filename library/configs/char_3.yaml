# From a four-view reference sheet. The bow belongs in an animation config: a sheet drops props.
name: char_3
module: character_sheet
rig: humanoid
styles:
- hi_fidelity
subject: a mint-green haired elf archer with pointed ears, blue eyes and a gold circlet, wearing a dark teal shoulder mantle with gold trim, a pale ice-blue layered robe dress with a high slit, sheer translucent ice-blue wide sleeves and side panels with crystal pendants, a brown leather belt, pale blue armoured greaves with snowflake motifs
