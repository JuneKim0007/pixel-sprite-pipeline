    torso: 1.55
    arms: 1.45
    legs: 1.24
    neck: 1.24
    head: 1.02
canonical:
  seed: 33940
  candidates: 2
  style_weight: 0.25
frames:
  style_weight: 0.25
  depth_controlnet:
    strength: 0.55
    start_percent: 0.0
    end_percent: 0.65
  ip_adapter:
    anchor_falloff: 0.7
    anchor_far_weight: 0.5
