# Character sheet — one creature, four views, T-pose. This runs first for a new character.

name: character_sheet

# Scopes the settings UI, so a T-pose sheet shows no knobs about LLM-authored motion.
module: character_sheet

subject: a knight in steel armor
style: pixel art, game sprite

# Body plan. Only humanoid gets openpose; every other rig falls back to scribble + depth.
rig: humanoid

pipeline:
  stages: [pose, depth, canonical, frames, palette, export]
  stop_after: pose
  # stop_after: pose      # uncomment to check the rig before spending GPU time

comfy:
  host: http://127.0.0.1:8188

pose:
  source: tpose         # synthesised from the rig; no pose file needed
  size: 1024
  set:
  - {view: front}
  - {view: side}            # character's left side
  - {view: rear}
  - {view: 270}             # right side — the mirror of `side`

depth:
  near: 255
  far: 60
  blur: 6.0

# Worth full quality: every view, and every animation generated later, inherits from it.
canonical:
  seed: 1234            # PIN THIS. It defines who the character is.
  lcm: false
  steps: 30
  cfg: 7.0
  lora_strength: 1.2
  width: 1024
  height: 1024
  # candidates: 4       # generate several and keep them all, to pick from

frames:
  lcm: false
  steps: 25             # a sheet is generated once and reused forever
  cfg: 7.0
  lora_strength: 1.2
  denoise: 1.0
  width: 1024
  height: 1024

  controlnet:
    # union_type:       # blank = follow the rig. Only override deliberately.
    strength: 0.75
    start_percent: 0.0
    end_percent: 0.55

  depth_controlnet:
    strength: 0.45      # keep below the pose strength or sprites look rendered
    start_percent: 0.0
    end_percent: 0.6

  ip_adapter:
    weight: 0.7
    weight_type: style and composition
    start_at: 0.0
    end_at: 1.0

# Weight falls off as views turn away, which stops a front reference forcing a front-facing rear.
references:
  match:
    auto: true
    tolerance_degrees: 40
    exact_weight: 0.85
    far_weight: 0.45

  identity:
  - path: library/refs/knight_front.png
    view: front
    weight_scale: 1
  style: []
  pose: []
  palette: []
palette:
  source: extract       # from the canonical's subject, background keyed out
  size: 16              # sheets carry a whole character, so a little wider
  factor: 8
  reduce: median
  alpha_tolerance: 14
  upscale: 1

# Writes per-view PNGs AND joined sheets for sprites, skeletons and depth maps.
export:
  columns: 4            # front · side · rear · right
  scale: 4
